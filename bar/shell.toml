# HyprMac bar layout (installed by HyprMac; delete this file to get OmniWM's own layout back).
# OmniWM's full-width bar covers the macOS menu bar, so HyprMac's `tray` widget shows your menu bar apps
# in it, next to the volume and Wi-Fi.
profiles.default.trailing = ["media", "notifications", "tray", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]

[profiles.default.workspaceBar]
# Workspaces with no windows take no room, which leaves space for the tray on the MacBook screen.
hideEmptyWorkspaces = true
