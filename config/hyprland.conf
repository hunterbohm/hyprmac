# HyprMac: Hyprland-style config for macOS (window manager underneath: OmniWM).
# Save this file and changes apply at once, like Hyprland. Mistakes show up in a red bar at the top.
#
# Keys: SUPER is your Option (⌥) key, where Super sits on a PC keyboard. ALT is Command (⌘).
#       CTRL is Control. You can also write OPTION, COMMAND or CONTROL to name a Mac key directly.
# Check it:  hyprctl check      List binds:  hyprctl binds      Reload:  hyprctl reload

$mod = SUPER
$terminal = osascript -e 'tell application "Ghostty" to new window' || open -a Ghostty
$browser = open -a Helium
$fileManager = open -a Finder

# ---------------------------------------------------------------- look and feel
general {
    gaps_in = 5                 # space around each window (10 between two windows)
    gaps_out = 10               # space at the screen edges
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    layout = dwindle            # dwindle (Hyprland tiling) or scrolling (columns, like niri)
}

animations {
    enabled = true
    speed = 1.0                 # HyprMac extra: 2.0 is twice as fast
}

input {
    follow_mouse = 0            # 1 = focus follows the mouse, like Hyprland's default
}

dwindle {
    split_width_multiplier = 1.0
    smart_split = false
}

hyprmac {
    super_key = option          # option, command or control
}

# ---------------------------------------------------------------- workspaces
workspace = 1, monitor:main
workspace = 2, monitor:main
workspace = 3, monitor:main
workspace = 4, monitor:main
workspace = 5, monitor:main
workspace = 6, monitor:main
workspace = 7, monitor:main
workspace = 8, monitor:main
workspace = 9, monitor:main
workspace = 10, monitor:main, name:0
workspace = 11, monitor:secondary, name:left
workspace = 12, monitor:secondary, name:right

# ---------------------------------------------------------------- apps
bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, RETURN, exec, $browser
bind = $mod SHIFT, F, exec, $fileManager

# Jump to an app's window, opening the app when it has none
bind = $mod, B, focusapp, net.imput.helium
bind = $mod, C, focusapp, com.openai.codex
bind = $mod, T, focusapp, com.mitchellh.ghostty
bind = $mod, O, focusapp, md.obsidian
bind = $mod, D, focusapp, dev.vencord.vesktop

# ---------------------------------------------------------------- windows
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, slash, togglesplit
bind = $mod, comma, balance
bind = $mod SHIFT, slash, layout, toggle       # dwindle <-> scrolling for this workspace
bind = $mod SHIFT, O, overview
bind = $mod, grave, omniwm, toggle-quake-terminal
bind = $mod CTRL, SPACE, omniwm, open-command-palette

# Focus and move with vim keys (Option+arrows stay free for jumping words in text)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod CTRL, H, moveintogroup, l
bind = $mod CTRL, J, moveintogroup, d
bind = $mod CTRL, K, moveintogroup, u
bind = $mod CTRL, L, moveintogroup, r

# Resize
binde = $mod, minus, resizeactive, -50 0
binde = $mod, equal, resizeactive, 50 0
binde = $mod SHIFT, minus, resizeactive, 0 -50
binde = $mod SHIFT, equal, resizeactive, 0 50

bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -50 0
binde = , L, resizeactive, 50 0
binde = , K, resizeactive, 0 -50
binde = , J, resizeactive, 0 50
binde = SHIFT, H, resizeactive, -100 0
binde = SHIFT, L, resizeactive, 100 0
bind = , B, balance
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Drag with SUPER held: left button moves, right button resizes
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ---------------------------------------------------------------- workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, A, workspace, 12
bind = $mod, S, workspace, 11

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, A, movetoworkspace, 12
bind = $mod SHIFT, S, movetoworkspace, 11

# Control+number does the same, as in your AeroSpace setup
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9, workspace, 9
bind = CTRL, 0, workspace, 10
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9
bind = CTRL SHIFT, 0, movetoworkspace, 10

bind = $mod, TAB, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Scratchpad (Hyprland's special workspace)
bind = $mod, Z, togglespecialworkspace, magic
bind = $mod SHIFT, Z, movetoworkspace, special:magic

# Monitors
bind = CTRL $mod SHIFT, J, movewindow, mon:r
bind = CTRL $mod SHIFT, K, movewindow, mon:l
bind = CTRL $mod, J, focusmonitor, +1
bind = CTRL $mod, K, focusmonitor, -1

# Your existing theme shortcut
bind = HYPER, L, exec, sleep 1; ~/.local/bin/system-theme
